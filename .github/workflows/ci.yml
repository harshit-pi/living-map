name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # the husky hook is for local commits; CI runs the same checks directly
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      # the agent docs (AGENTS.md, CLAUDE.md, skills) still match the code
      - run: python3 ../.github/agent-docs/check.py ..

  # Every push to main that passes the checks becomes a release, named
  # v<major.minor from app/package.json>.<run number>. Running apps compare
  # themselves with the latest release and offer a one-click update.
  release:
    needs: app
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(node -p "require('./app/package.json').version.split('.').slice(0, 2).join('.')")
          tag="v${base}.${{ github.run_number }}"
          gh release create "$tag" --target "${{ github.sha }}" --title "Living Map $tag" --generate-notes
